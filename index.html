<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <form id="login-form">
            <h1>Login</h1>
            
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" placeholder="Digite 'user'" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" placeholder="Digite '1234'" required>
            </div>
            
            <p id="error-message" class="error-message"></p>

            <div class="remember-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Lembrar-me</label>
            </div>

            <button type="submit" class="login-button">LOGAR</button>
        </form>
    </div>

    <script src="js/login.js" defer></script>

</body>
</html>
